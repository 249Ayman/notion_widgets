<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato:400,700|Montserrat:900">  
    <title>Document</title>  
    <style>  
        body {  
            background-color: white;  
        }  

        #timer {  
            color: #eeeeee;  
            text-align: center;  
            text-transform: uppercase;  
            font-family: 'Lato', sans-serif;  
            font-size: .7em;  
            letter-spacing: 5px;  
        }  

        .months, .weeks, .days {  
            display: inline-block;  
            padding: 20px;  
            width: 100px;  
            border-radius: 5px;  
        }  

        .months {  
            background: #EF2F3C;  
        }  

        .weeks {  
            background: #eeeeee;  
            color: #183059;  
        }  

        .days {  
            background: #276FBF;  
        }  

        .numbers {  
            font-family: 'Montserrat', sans-serif;  
            color:  #183059;  
            font-size: 4em;  
            text-align: center;  
        }  
    </style>  
</head>  
<body>  
    
<div id="timer">  
    <div class="months">   
        <div id="months" class="numbers"> </div>months</div>   
    <div class="weeks">   
        <div id="weeks" class="numbers"> </div>weeks</div>   
    <div class="days">   
        <div id="days" class="numbers"> </div>days</div>   
</div>  

</div>  

<script>  
    const myDate = new Date('Apr 14, 2025 00:00:00');  

    // countdown  
    let timer = setInterval(function() {  
        // get today's date  
        const today = new Date().getTime();  

        // get the difference  
        const diff = myDate - today;  

        // math  
        const totalDays = Math.floor(diff / (1000 * 60 * 60 * 24));  
        const months = Math.floor(totalDays / 30);  
        const weeks = Math.floor((totalDays % 30) / 7);  
        const days = totalDays % 7;  

        // display  
        document.getElementById("months").innerHTML = months;  
        document.getElementById("weeks").innerHTML = weeks;  
        document.getElementById("days").innerHTML = days;  

        // If the countdown is over, write some text  
        if (diff < 0) {  
            clearInterval(timer);  
            document.getElementById("timer").innerHTML = "Countdown Finished!";  
        }  

    }, 1000);  
</script>  
</body>  
</html>
